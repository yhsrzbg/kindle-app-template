name: CI

on:
  push:
  pull_request:

jobs:
  native-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ imagemagick libgtk2.0-dev meson ninja-build shellcheck xvfb
      - name: Validate and test
        run: python3 -m unittest discover -s tests -v
      - name: Build native smoke-test binary
        run: ./scripts/build.sh native debug
      - name: Run project checks
        run: ./scripts/check.sh native
      - name: Capture Kindle-sized GUI previews
        run: ./scripts/capture-previews.sh dist/previews legacy paperwhite-hd
      - name: Upload GUI previews
        uses: actions/upload-artifact@v7
        with:
          name: kindle-gui-previews
          path: dist/previews/*.png
