name: CI

on:
  push:
  pull_request:

jobs:
  native-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libgtk2.0-dev meson ninja-build shellcheck
      - name: Validate and test
        run: python3 -m unittest discover -s tests -v
      - name: Build native smoke-test binary
        run: ./scripts/build.sh native debug
      - name: Run project checks
        run: ./scripts/check.sh native
